{% extends "base.html" %}
{% block title %}首頁 — 捷捷寶寶粥 訂單轉換系統{% endblock %}

{% block content %}
<div class="row g-4">

  <!-- 左欄：輸入區 -->
  <div class="col-lg-5">
    <div class="glass-card p-4 h-100">
      <h5 class="fw-bold mb-4" style="color:#c2410c">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="me-2" style="vertical-align:-3px"><path d="M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7zm2 0v10h14V7H5zm2 2h10v2H7V9zm0 4h7v2H7v-2z"/></svg>
        訂單轉換
      </h5>

      <div class="mb-3">
        <label class="form-label fw-semibold small">資料夾路徑</label>
        <div class="input-group">
          <input type="text" class="glass-input form-control" id="folderInput"
                 placeholder="選擇或輸入資料夾路徑"
                 value="{{ default_folder }}">
          <button class="btn btn-glass-secondary px-3" type="button" onclick="browseFolderPicker('folderInput')" title="選擇資料夾">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>
            </svg>
          </button>
          <button class="btn btn-glass-secondary px-3" id="btnScan" onclick="doScan()">
            <span id="scanIcon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 21l-4.35-4.35M17 11A6 6 0 105 11a6 6 0 0012 0z"/></svg>
            </span>
            <span id="scanSpinner" class="spinner-border spinner-border-sm d-none"></span>
            掃描
          </button>
        </div>
        <div class="form-text">輸入含有待處理訂單檔案的資料夾路徑</div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold small">執行者名稱</label>
        <input type="text" class="glass-input form-control" id="operatorInput"
               placeholder="請輸入您的名稱" value="{{ default_operator }}">
      </div>

      <button class="btn btn-glass-primary w-100 py-2" id="btnConvert"
              onclick="doConvert()" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="me-2" style="vertical-align:-3px">
          <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        開始轉換
      </button>

      <!-- 進度區 -->
      <div id="progressArea" class="mt-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <small class="fw-semibold" style="color:#9a3412" id="progressLabel">處理中...</small>
          <small id="progressPct" style="color:#c2410c">0%</small>
        </div>
        <div class="progress-glass mb-2">
          <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
        </div>
        <div id="progressLog" class="small" style="color:#7c3012;max-height:80px;overflow-y:auto"></div>
      </div>
    </div>
  </div>

  <!-- 右欄：掃描結果 + 結果卡片 -->
  <div class="col-lg-7">

    <!-- 空狀態 -->
    <div id="emptyState" class="empty-state glass-card">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="1.2" class="mb-3">
        <path d="M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>
        <path d="M8 11h8M8 15h5"/>
      </svg>
      <p class="fw-semibold mb-1" style="color:#9a3412">尚未掃描資料夾</p>
      <small style="color:#b45309">輸入資料夾路徑後點擊「掃描」開始</small>
    </div>

    <!-- 掃描結果列表 -->
    <div id="fileListArea" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold mb-0" style="color:#7c3012">
          掃描結果
          <span class="badge bg-warning bg-opacity-25 text-warning-emphasis ms-2 rounded-pill" id="fileCountBadge">0 個檔案</span>
        </h6>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-glass-secondary" onclick="toggleAllFiles(true)">全選</button>
          <button class="btn btn-sm btn-glass-secondary" onclick="toggleAllFiles(false)">取消</button>
          <button class="btn btn-sm btn-glass-secondary" onclick="doScan()">重新掃描</button>
        </div>
      </div>

      <div id="fileList" class="mb-3"></div>

      <!-- 未識別手動指定 -->
      <div id="unknownPanel" class="glass-card p-3 d-none mb-3" style="border-left:3px solid #94a3b8">
        <small class="fw-semibold d-block mb-2" style="color:#475569">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" class="me-1"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
          有檔案無法自動識別，請手動指定來源
        </small>
        <select class="glass-input form-select form-select-sm" id="forcedSource">
          <option value="">— 請選擇 —</option>
          <option value="shopee">蝦皮</option>
          <option value="a1baby">婦幼展</option>
          <option value="leage">樂齡網</option>
          <option value="a1leage">樂齡官網</option>
        </select>
      </div>
    </div>

    <!-- 結果卡片 -->
    <div id="resultArea" class="d-none">
      <h6 class="fw-bold mb-3" style="color:#7c3012">轉換結果</h6>
      <div class="row g-3">
        <div class="col-4">
          <div class="result-card text-center p-3" style="--card-accent:#22c55e">
            <div class="result-icon mb-1" style="color:#22c55e">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <div class="display-6 fw-bold count-up" id="resSuccess" data-target="0" style="color:#15803d">0</div>
            <small style="color:#166534">成功</small>
          </div>
        </div>
        <div class="col-4">
          <div class="result-card text-center p-3" style="--card-accent:#ef4444">
            <div class="result-icon mb-1" style="color:#ef4444">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <div class="display-6 fw-bold count-up" id="resFail" data-target="0" style="color:#b91c1c">0</div>
            <small style="color:#991b1b">失敗</small>
          </div>
        </div>
        <div class="col-4">
          <div class="result-card text-center p-3" style="--card-accent:#f97316">
            <div class="result-icon mb-1" style="color:#f97316">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            </div>
            <div class="display-6 fw-bold count-up" id="resManual" data-target="0" style="color:#c2410c">0</div>
            <small style="color:#9a3412">待人工</small>
          </div>
        </div>
      </div>

      <div id="resultActions" class="mt-3 d-flex gap-2 flex-wrap"></div>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Source labels & badge classes
const SOURCE_LABELS = {{ source_labels | tojson }};
</script>
{% endblock %}
